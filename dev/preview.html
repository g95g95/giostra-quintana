<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anteprima moduli</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}#err{position:fixed;left:8px;top:8px;color:#f55;font:14px monospace;white-space:pre-wrap;z-index:9}</style>
</head>
<body>
<div id="err"></div>
<script>
window.onerror = function (m, src, line) { document.getElementById('err').textContent += m + ' @ ' + src + ':' + line + '\n'; };
</script>
<script src="../vendor/three.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/rules.js"></script>
<script src="../js/track.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/world.js" onerror="void 0"></script>
<script src="../js/figuranti.js" onerror="void 0"></script>
<script src="../js/horse.js" onerror="void 0"></script>
<script src="../js/moro.js" onerror="void 0"></script>
<script>
// Uso: preview.html?mods=world,figuranti,horse,moro&cam=x,y,z&look=x,y,z&t=2&fov=55
// Disegna i moduli richiesti, simula t secondi a passi di 1/30 s e resta sull'ultimo fotogramma.
(function () {
  const qs = new URLSearchParams(location.search);
  const mods = (qs.get('mods') || 'world').split(',');
  const v3 = (k, d) => (qs.get(k) || d).split(',').map(Number);
  const cam = v3('cam', '60,45,110');
  const look = v3('look', '0,0,0');
  const t = Number(qs.get('t') || 1);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(Number(qs.get('fov') || 55), innerWidth / innerHeight, 0.1, 1500);
  camera.position.set(cam[0], cam[1], cam[2]);
  camera.lookAt(look[0], look[1], look[2]);

  const updaters = [];
  if (mods.includes('world') && Q.World) updaters.push(Q.World.build(scene, renderer));
  else {
    scene.background = new THREE.Color(0x9fc4e8);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(40, 80, 30);
    scene.add(sun);
    const g = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x5c8a3c }));
    g.rotation.x = -Math.PI / 2;
    scene.add(g);
  }
  if (mods.includes('figuranti') && Q.Figuranti) updaters.push(Q.Figuranti.build(scene, { playerSestiereId: qs.get('sestiere') || 'romana' }));
  if (mods.includes('moro') && Q.Moro) { const m = Q.Moro.create(); scene.add(m.group); updaters.push(m); }
  if (mods.includes('horse') && Q.Horse) {
    const s = Q.sestiere(qs.get('sestiere') || 'romana');
    const h = Q.Horse.create({ c1: s.c1, c2: s.c2 });
    const hs = Number(qs.get('hs') || Q.track.moro.s - 12);
    const p = Q.track.offsetAt(hs, 1.3);
    h.group.position.set(p.x, 0, p.z);
    h.group.rotation.y = Q.track.yawOf(p);
    scene.add(h.group);
    const tip = qs.get('lance') === '0' ? null : new THREE.Vector3(-1.05, 2.05, 2.6);
    updaters.push({ update: (dt) => h.update(dt, { speed: Number(qs.get('speed') || 14), steer: 0, tip }) });
  }

  let time = 0;
  for (let i = 0; i < Math.round(t * 30); i++) { time += 1 / 30; updaters.forEach((u) => u && u.update && u.update(1 / 30, time)); }
  renderer.render(scene, camera);
  document.title = 'pronto';
  if (qs.get('live')) (function loop() { time += 1 / 60; updaters.forEach((u) => u && u.update && u.update(1 / 60, time)); renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
